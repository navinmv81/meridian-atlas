name = "meridian-ops"
main = "src/ops-api.js"
compatibility_date = "2024-01-01"

# No [triggers] section — on-request only by design (August Operating Layer
# Blueprint, Section 5). This is a human-driven dashboard backend, not a
# pipeline, so it doesn't need one of the account's 5 Cron Trigger slots.

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "meridian-etf"
database_id = "43e80149-5333-4917-b678-6a8218ca4f93"
