name = "meridian-ops"
main = "src/ops-api.js"
compatibility_date = "2024-01-01"

# No [triggers] section — on-request only by design (August Operating Layer
# Blueprint, Section 5). This is a human-driven dashboard backend, not a
# pipeline, so it doesn't need one of the account's 5 Cron Trigger slots.

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "meridian-etf"
database_id = "43e80149-5333-4917-b678-6a8218ca4f93"

# MA-AUG-006, 2 August 2026 — live Cloudflare metrics routes (/api/ops/cf/*).
# CF_ACCOUNT_TAG is an identifier, not a credential — plain var is correct
# here, not a secret. CF_ANALYTICS_TOKEN (the actual credential, Account >
# Account Analytics > Read scope) is set separately via `wrangler secret put`
# — never put a real token value in this file.
[vars]
CF_ACCOUNT_TAG = "ea36070477560935a68ad9110a2fd40b"

# MA-OCT-001 — Ops backend foundation (spec claude/MA-OCT-001_Spec.md §6, §8.4).
# Ingest kill switches: OPS_INGEST_ENABLED="false" + `wrangler deploy` is the
# hard switch (ingest returns 202 before any D1 read). OPS_INGEST_DAILY_EVENT_CAP
# bounds ingest at <= 1000 events/day (~5,000 row-writes, 5% of the D1 cap).
# The emitter key map OPS_INGEST_KEYS ({emitter_id: sha256_hex(key)}, hashes
# only) is a SECRET set with `wrangler secret put` — never put it here.
OPS_INGEST_ENABLED = "true"
OPS_INGEST_DAILY_EVENT_CAP = "1000"
# Cloudflare Access app "meridian-ops admin" (path /api/ops/admin). Team domain
# and AUD are identifiers, not credentials (entities-api precedent). This app
# has its OWN AUD (not 015b's). If either is missing, every /api/ops/admin/*
# route fails closed with 401.
CF_ACCESS_TEAM_DOMAIN = "meridian-atlas-except.cloudflareaccess.com"
CF_ACCESS_AUD = "7f1b678452f2038a2900e478943d933ff39f24e3f9fac976b62eb2aae8c222cc"
